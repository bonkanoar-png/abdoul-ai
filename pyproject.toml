[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]
exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP041"]

[tool.ruff.lint.per-file-ignores]
"backend/app/infrastructure/database/models/*.py" = ["F821"]
"backend/tests/unit/test_database.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = ["backend/app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.infrastructure.database.models.*"
disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
module = "app.api.routes.portfolio"
disable_error_code = ["arg-type"]
