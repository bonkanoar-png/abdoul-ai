name: abdoul-ai

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: abdoul-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abdoul_ai}
      POSTGRES_USER: ${POSTGRES_USER:-abdoul_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - abdoul-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 1536m
    pids_limit: 256

  redis:
    image: redis:7.4-alpine
    container_name: abdoul-ai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - abdoul-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 128

  backend:
    build:
      context: ./backend
    container_name: abdoul-ai-backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abdoul_ai}
      POSTGRES_USER: ${POSTGRES_USER:-abdoul_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-abdoul_ai}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-abdoul_ai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIRECTORY: /app/uploads
      PUBLIC_UPLOAD_BASE_URL: /uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - abdoul-ai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 1024m
    pids_limit: 256

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: abdoul-ai-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - abdoul-ai-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 1024m
    pids_limit: 256

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: abdoul-ai-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - abdoul-ai-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  loki-init:
    image: alpine:3.23
    container_name: abdoul-ai-loki-init
    command: ["chown", "10001:10001", "/loki"]
    volumes:
      - loki-data:/loki
    networks:
      - abdoul-ai-network
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  loki:
    image: grafana/loki:3.6.0
    container_name: abdoul-ai-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - abdoul-ai-network
    depends_on:
      loki-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  alloy:
    image: grafana/alloy:v1.11.3
    container_name: abdoul-ai-alloy
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - abdoul-ai-network
    depends_on:
      - loki
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:12.3.1
    container_name: abdoul-ai-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - abdoul-ai-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres-backup:
    image: postgres:17-alpine
    container_name: abdoul-ai-postgres-backup
    environment:
      PGUSER: ${POSTGRES_USER:-abdoul_ai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-abdoul_ai}
      POSTGRES_DB: ${POSTGRES_DB:-abdoul_ai}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    command: ["sh", "/scripts/backup-postgres.sh"]
    volumes:
      - ./docker/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - postgres-backups:/backups
    networks:
      - abdoul-ai-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  uploads-backup:
    image: alpine:3.22
    container_name: abdoul-ai-uploads-backup
    command: ["sh", "-c", "while true; do /scripts/uploads-backup.sh backup; sleep $${UPLOADS_BACKUP_INTERVAL_SECONDS:-86400}; done"]
    environment:
      UPLOADS_BACKUP_RETENTION_DAYS: ${UPLOADS_BACKUP_RETENTION_DAYS:-14}
      UPLOADS_BACKUP_INTERVAL_SECONDS: ${UPLOADS_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup/uploads-backup.sh:/scripts/uploads-backup.sh:ro
      - uploads-data:/uploads
      - uploads-backup-data:/backups
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    network_mode: none
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
  postgres-backups:
  uploads-data:
  uploads-backup-data:

networks:
  abdoul-ai-network:
    name: abdoul-ai-network
    driver: bridge
