server {
    listen 8080 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/proxy-routes.conf;
}

# Keeps the production TLS port reserved without requiring a fake certificate.
# Replace this block by enabling tls.conf.example after mounting real certificates.
server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
