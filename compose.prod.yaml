# Production-oriented overrides. Use with:
# docker compose --env-file .env.production -f compose.yaml -f compose.prod.yaml up -d
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    networks: !override
      - data-network

  redis:
    ports: !reset []
    networks: !override
      - data-network

  backend:
    image: ghcr.io/bonkanoar-png/abdoul-ai-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      CORS_ORIGINS: '["${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}"]'
    networks: !override
      - backend-network
      - data-network

  frontend:
    image: ghcr.io/bonkanoar-png/abdoul-ai-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      args:
        NEXT_PUBLIC_API_URL: http://nginx:8080
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
    environment:
      NEXT_PUBLIC_API_URL: http://nginx:8080
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
    ports: !reset []
    networks: !override
      - frontend-network

  nginx:
    image: nginx:1.29-alpine
    container_name: abdoul-ai-nginx
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - proxy-network
      - frontend-network
      - backend-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/nginx-health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128

  prometheus:
    ports: !reset []
    networks: !override
      - backend-network
      - monitoring-network

  loki:
    ports: !reset []
    networks: !override
      - monitoring-network

  loki-init:
    networks: !override
      - monitoring-network

  alloy:
    networks: !override
      - monitoring-network

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    networks: !override
      - monitoring-network

  postgres-backup:
    environment:
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    networks: !override
      - data-network

networks:
  abdoul-ai-network: !reset null
  proxy-network:
    driver: bridge
  frontend-network:
    driver: bridge
    internal: true
  backend-network:
    driver: bridge
    internal: true
  data-network:
    driver: bridge
    internal: true
  monitoring-network:
    driver: bridge
    internal: true
